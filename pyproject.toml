[project]
name = "logvault"
version = "0.1.0"
description = "LogVault - encrypted cloud log archive and integrity audit system (college mini-project)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "Flask>=3.1,<4.0",
  "Flask-WTF>=1.2,<2.0",
  "boto3>=1.34,<2.0",
  "cryptography>=43.0",
  "python-dotenv>=1.0,<2.0",
  "gunicorn>=22.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
